name: Uptime CI
on:
  schedule:
    - cron: 0/5 * * * *
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    name: Check Status
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update Uptime
        uses: upptime/uptime-monitor@master
        with:
          user: artistxoder
          repo: artistxoder.github.io
