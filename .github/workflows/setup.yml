name: Uptime CI

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    name: Check Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Update Uptime
        uses: upptime/uptime-monitor@v1.43.15
        with:
          command: "update"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
