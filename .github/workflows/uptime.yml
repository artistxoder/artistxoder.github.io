name: Uptime CI

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    name: Check Status
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Upptime
        run: npm install -g @upptime/uptime-monitor

      - name: Run Uptime Check
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: uptime-monitor update
