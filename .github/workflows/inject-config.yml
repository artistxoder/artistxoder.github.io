name: Inject config
on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Inject API key
        run: |
          sed -i "s/UR_API_KEY_PLACEHOLDER/${{ secrets.UR_API_KEY }}/g" status.html
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add status.html
          git commit -m "Inject config" || echo "No changes"
          git push
