<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Archive Viewer</title>
    <style>
        :root {
            --bg-base: #0d1117;
            --bg-surface: #161b22;
            --bg-hover: #21262d;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
            --font-code: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar File Tree */
        aside {
            width: 280px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .file-list {
            list-style: none;
            overflow-y: auto;
            padding: 8px;
        }

        .file-item {
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .file-item:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        .file-item.active {
            background-color: var(--bg-hover);
            color: var(--accent-color);
            font-weight: 500;
        }

        /* Main Content Editor Pane */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-base);
        }

        .editor-header {
            padding: 12px 16px;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-family: var(--font-code);
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            color: var(--text-primary);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside>
        <div class="sidebar-header">Repository Files</div>
        <ul class="file-list" id="fileList">
            <!-- Dynamic file items can be added here or populated via JS -->
            <li class="file-item active" onclick="loadContent('invoices.json')">📄 invoices.json</li>
            <li class="file-item" onclick="loadContent('status.html')">🌐 status.html</li>
            <li class="file-item" onclick="loadContent('README.md')">📖 README.md</li>
        </ul>
    </aside>

    <!-- Main Viewer -->
    <main>
        <div class="editor-header">
            <span id="currentFileName">invoices.json</span>
            <span style="font-size: 12px; color: var(--text-secondary);">UTF-8</span>
        </div>
        <div class="editor-content" id="fileContent">
{
  "client": "Igor Tylman",
  "status": "Pending Customs Duties",
  "tracking": "FedEx International",
  "items": [
    {
      "description": "Custom 3D Printed Assemblies",
      "value": "Pending Verification"
    }
  ]
}
        </div>
    </main>

    <script>
        function loadContent(filename) {
            // Update active state in sidebar
            const items = document.querySelectorAll('.file-item');
            items.forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Update header title
            document.getElementById('currentFileName').innerText = filename;

            // Simple mock content loader (replace with your fetch logic if loading external files)
            const contentBox = document.getElementById('fileContent');
            if (filename === 'invoices.json') {
                contentBox.innerText = `{\n  "client": "Igor Tylman",\n  "status": "Pending Customs Duties",\n  "tracking": "FedEx International",\n  "items": [\n    {\n      "description": "Custom 3D Printed Assemblies",\n      "value": "Pending Verification"\n    }\n  ]\n}`;
            } else if (filename === 'status.html') {
                contentBox.innerText = `<!DOCTYPE html>\n<html>\n<head><title>Status</title></head>\n<body>\n  <h1>System Operational</h1>\n</body>\n</html>`;
            } else {
                contentBox.innerText = `# Archive Repository\n\nManaged via local home lab tools.`;
            }
        }
    </script>
</body>
</html>
